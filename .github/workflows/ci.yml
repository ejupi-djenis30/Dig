name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.node }})
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            node-version: "22.23.1"
            npm-version: "10.9.8"
          - node: 24
            node-version: "24.18.0"
            npm-version: "11.16.0"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Verify exact Node.js runtime
        shell: bash
        env:
          EXPECTED_NODE_VERSION: ${{ matrix.node-version }}
          EXPECTED_NPM_VERSION: ${{ matrix.npm-version }}
        run: |
          [[ "$(node --version)" == "v${EXPECTED_NODE_VERSION}" ]]
          [[ "$(npm --version)" == "${EXPECTED_NPM_VERSION}" ]]
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm pack --ignore-scripts --dry-run
      - run: npm audit --audit-level=moderate

  container-smoke:
    name: Container build and smoke
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the production image
        run: docker build --tag dig-smoke:local .
      - name: Exercise the authenticated loopback deployment
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            docker rm --force dig-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach \
            --name dig-smoke \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777,noexec,nosuid,nodev \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 100 \
            --env DIG_ACCESS_TOKEN=ci-smoke-token-32-bytes-long-0001 \
            --env DIG_ORIGIN=http://127.0.0.1:4175 \
            --publish 127.0.0.1:4175:4175 \
            dig-smoke:local
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              docker logs dig-smoke
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/Dig/api/config |
            grep --fixed-strings '"requiresAccessToken":true'
          curl --fail --silent \
            --header 'Authorization: Bearer ci-smoke-token-32-bytes-long-0001' \
            --header 'Content-Type: application/json' \
            --data '{"address":"gopher://example.org/hURL%3Ahttps%3A%2F%2Fexample.com%2F"}' \
            http://127.0.0.1:4175/Dig/api/fetch |
            grep --fixed-strings '"kind":"external"'

  browser-e2e:
    name: Browser E2E (Chromium + WebKit)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Verify exact toolchain
        shell: bash
        env:
          EXPECTED_NODE_VERSION: "22.23.1"
          EXPECTED_NPM_VERSION: "10.9.8"
        run: |
          [[ "$(node --version)" == "v${EXPECTED_NODE_VERSION}" ]]
          [[ "$(npm --version)" == "${EXPECTED_NPM_VERSION}" ]]
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned browser runtimes
        run: npx --no-install playwright install --with-deps chromium webkit
      - name: Exercise the real protocol explorer
        run: npm run test:e2e
      - name: Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dig-playwright-diagnostics
          path: test-results/playwright
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android build
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up exact Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install locked JavaScript dependencies
        run: npm ci --ignore-scripts
      - name: Install Android SDK 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Synchronize packaged Android assets
        run: npm run android:sync
      - name: Test, lint, and assemble the Android app
        run: |
          chmod +x android/gradlew
          ./android/gradlew \
            --no-daemon \
            --project-dir android \
            :verifyDependencyLocks \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:lintRelease \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:assembleDebugAndroidTest
