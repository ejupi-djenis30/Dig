name: Release readiness

on:
  pull_request:
  workflow_dispatch:
    inputs:
      expected_tag:
        description: Optional v<version> value to exercise tag validation and signed Android packaging without publishing
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_PUBLICATION_ENABLED: "true"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Verify pinned Node.js toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v22.23.1" ]]
          [[ "$(npm --version)" == "10.9.8" ]]

      - name: Install locked release tooling
        run: npm ci --ignore-scripts

      - name: Validate synchronized release metadata and source
        id: metadata
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_TAG: ${{ inputs.expected_tag }}
        run: |
          set -euo pipefail
          arguments=()
          source_commit="$(git rev-parse HEAD)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            [[ "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" == "${source_commit}" ]]
            git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            default_head="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
            git merge-base --is-ancestor "${source_commit}" "${default_head}"
            arguments+=(--tag "${GITHUB_REF_NAME}")
          elif [[ -n "${EXPECTED_TAG}" ]]; then
            [[ "${GITHUB_REF_TYPE}" == "branch" ]]
            [[ "${GITHUB_REF_NAME}" == "${DEFAULT_BRANCH}" ]]
            git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")" ]]
            arguments+=(--tag "${EXPECTED_TAG}")
          fi
          version="$(node scripts/validate-release.mjs "${arguments[@]}")"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'source_commit=%s\n' "${source_commit}" >> "${GITHUB_OUTPUT}"

      - name: Test and audit all dependencies
        run: |
          npm run check
          npm audit --audit-level=moderate

      - name: Build and smoke-test installable CLI package
        id: package
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p target/package-a target/package-b target/install
          npm pack --ignore-scripts --pack-destination target/package-a
          npm pack --ignore-scripts --pack-destination target/package-b
          archive="target/package-a/dig-gopher-explorer-${VERSION}.tgz"
          comparison_archive="target/package-b/dig-gopher-explorer-${VERSION}.tgz"
          [[ -f "${archive}" ]]
          cmp "${archive}" "${comparison_archive}"
          npm install --ignore-scripts --global --prefix target/install "./${archive}"
          [[ "$(target/install/bin/dig-gopher --version)" == "DIG ${VERSION}" ]]
          printf 'archive=%s\n' "${archive}" >> "${GITHUB_OUTPUT}"

      - name: Capture SBOM and dependency evidence
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          npm sbom --omit=dev --sbom-format cyclonedx > target/sbom-a.raw.json
          sleep 1
          npm sbom --omit=dev --sbom-format cyclonedx > target/sbom-b.raw.json
          node scripts/normalize-sbom.mjs target/sbom-a.raw.json "target/dig-${VERSION}.cdx.json"
          node scripts/normalize-sbom.mjs target/sbom-b.raw.json target/sbom-b.cdx.json
          cmp "target/dig-${VERSION}.cdx.json" target/sbom-b.cdx.json
          npm ls --omit=dev --all --json > "target/dig-npm-dependencies-${VERSION}.json"
          npm ls --omit=dev --all --json > target/dependencies-b.json
          cmp "target/dig-npm-dependencies-${VERSION}.json" target/dependencies-b.json

      - name: Set up JDK 21 for signed Android release
        if: (github.event_name == 'workflow_dispatch' && inputs.expected_tag != '') || (github.event_name == 'push' && github.ref_type == 'tag')
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK command-line tools
        if: (github.event_name == 'workflow_dispatch' && inputs.expected_tag != '') || (github.event_name == 'push' && github.ref_type == 'tag')
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android SDK
        if: (github.event_name == 'workflow_dispatch' && inputs.expected_tag != '') || (github.event_name == 'push' && github.ref_type == 'tag')
        run: sdkmanager --install "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Materialize dedicated Android signing identity
        id: signing
        if: (github.event_name == 'workflow_dispatch' && inputs.expected_tag != '') || (github.event_name == 'push' && github.ref_type == 'tag')
        shell: bash
        env:
          DIG_ANDROID_KEYSTORE_BASE64: ${{ secrets.DIG_ANDROID_KEYSTORE_BASE64 }}
          DIG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DIG_ANDROID_KEYSTORE_PASSWORD }}
          DIG_ANDROID_KEY_ALIAS: ${{ secrets.DIG_ANDROID_KEY_ALIAS }}
          DIG_ANDROID_KEY_PASSWORD: ${{ secrets.DIG_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            DIG_ANDROID_KEYSTORE_BASE64 \
            DIG_ANDROID_KEYSTORE_PASSWORD \
            DIG_ANDROID_KEY_ALIAS \
            DIG_ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required Actions secret ${name}."
              missing=1
            fi
          done
          [[ "${missing}" == "0" ]]
          keystore="${RUNNER_TEMP}/dig-release-signing.p12"
          [[ ! -e "${keystore}" && ! -L "${keystore}" ]]
          umask 077
          set -o noclobber
          printf '%s' "${DIG_ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          set +o noclobber
          [[ -s "${keystore}" && ! -L "${keystore}" ]]
          chmod 0600 "${keystore}"

      - name: Build and verify signed Android APK
        if: (github.event_name == 'workflow_dispatch' && inputs.expected_tag != '') || (github.event_name == 'push' && github.ref_type == 'tag')
        env:
          DIG_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/dig-release-signing.p12
          DIG_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DIG_ANDROID_KEYSTORE_PASSWORD }}
          DIG_ANDROID_KEY_ALIAS: ${{ secrets.DIG_ANDROID_KEY_ALIAS }}
          DIG_ANDROID_KEY_PASSWORD: ${{ secrets.DIG_ANDROID_KEY_PASSWORD }}
          DIG_ANDROID_RELEASE_DIRECTORY: ${{ runner.temp }}/dig-android-release
          DIG_SOURCE_COMMIT: ${{ steps.metadata.outputs.source_commit }}
        run: npm run android:apk

      - name: Remove temporary Android signing material
        if: always() && steps.signing.outcome != 'skipped'
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/dig-release-signing.p12
        run: |
          set -euo pipefail
          case "${KEYSTORE_PATH}" in
            "${RUNNER_TEMP}"/*) ;;
            *) echo "::error::Refusing to remove an unsafe signing path."; exit 1 ;;
          esac
          rm -f -- "${KEYSTORE_PATH}"

      - name: Assemble and reverify release bundle
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          ANDROID_RELEASE_DIRECTORY: ${{ runner.temp }}/dig-android-release
          SIGNED_ANDROID_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.expected_tag != '') || (github.event_name == 'push' && github.ref_type == 'tag') }}
        run: |
          set -euo pipefail
          arguments=()
          if [[ "${SIGNED_ANDROID_RELEASE}" == "true" ]]; then
            apk="${ANDROID_RELEASE_DIRECTORY}/DIG-${VERSION}.apk"
            checksum="${apk}.sha256"
            [[ -f "${apk}" && ! -L "${apk}" ]]
            [[ -f "${checksum}" && ! -L "${checksum}" ]]
            arguments+=(--apk "${apk}" --apk-checksum "${checksum}")
          fi
          node scripts/validate-release.mjs \
            --assemble release \
            --commit "$(git rev-parse HEAD)" \
            --archive "${ARCHIVE}" \
            --sbom "target/dig-${VERSION}.cdx.json" \
            --dependencies "target/dig-npm-dependencies-${VERSION}.json" \
            "${arguments[@]}"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dig-release-candidate
          path: release
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Attest and publish tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Enforce static publication approval
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_PUBLICATION_ENABLED}" == "true" ]] || {
            echo "Release publication is disabled by the repository's static release policy." >&2
            exit 1
          }

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce checked-in license
        shell: bash
        run: |
          set -euo pipefail
          [[ -f LICENSE && ! -L LICENSE ]] || {
            echo "Release publication requires the canonical MIT LICENSE file." >&2
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.1"
          cache: npm

      - name: Verify pinned Node.js toolchain
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(node --version)" == "v22.23.1" ]]
          [[ "$(npm --version)" == "10.9.8" ]]

      - name: Set up JDK 21 for independent APK verification
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK for independent APK verification
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android verification tools
        run: sdkmanager --install "platforms;android-36" "build-tools;${ANDROID_BUILD_TOOLS_VERSION}"

      - name: Install verified GitHub CLI
        shell: bash
        env:
          GH_CLI_VERSION: "2.94.0"
          GH_CLI_SHA256: "a757f1ba6db18f4de8cbadb244843a5f89bc75b5e7c6fc127d2bd77fbd12ed62"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GH_CLI_SHA256}" "${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}"
          gh_directory="${RUNNER_TEMP}/gh_${GH_CLI_VERSION}_linux_amd64/bin"
          [[ "$("${gh_directory}/gh" --version | head -n 1)" == "gh version ${GH_CLI_VERSION} (2026-06-10)" ]]
          printf '%s\n' "${gh_directory}" >> "${GITHUB_PATH}"

      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dig-release-candidate
          path: release

      - name: Reverify tag, default-branch source, inventory, and checksums
        id: source
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          source_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          [[ "${source_commit}" == "$(git rev-parse HEAD)" ]]
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          default_head="$(git rev-parse "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")"
          git merge-base --is-ancestor "${source_commit}" "${default_head}"
          version="$(node scripts/validate-release.mjs --tag "${GITHUB_REF_NAME}")"
          printf 'source_commit=%s\n' "${source_commit}" >> "${GITHUB_OUTPUT}"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          node scripts/validate-release.mjs \
            --tag "${GITHUB_REF_NAME}" \
            --verify-bundle release \
            --require-android true \
            --commit "${source_commit}"

      - name: Independently verify signed Android APK
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SOURCE_COMMIT: ${{ steps.source.outputs.source_commit }}
        run: >-
          node scripts/verify-android-apk.mjs
          --apk "release/DIG-${VERSION}.apk"
          --checksum "release/DIG-${VERSION}.apk.sha256"
          --commit "${SOURCE_COMMIT}"

      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: release/SHA256SUMS

      - name: Attest checksum manifest
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: release/SHA256SUMS

      - name: Verify release provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/verify-attestations.mjs
          --directory release
          --repository "${{ github.repository }}"
          --signer-workflow "${{ github.repository }}/.github/workflows/release.yml"
          --source-commit "${{ steps.source.outputs.source_commit }}"
          --source-ref "${{ github.ref }}"

      - name: Stage, verify, and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/publish-release.mjs
          --directory release
          --tag "${{ github.ref_name }}"
          --repository "${{ github.repository }}"
          --default-branch "${{ github.event.repository.default_branch }}"
          --source-commit "${{ steps.source.outputs.source_commit }}"
