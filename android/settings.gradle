import org.gradle.api.artifacts.dsl.LockMode

include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')

apply from: 'capacitor.settings.gradle'

gradle.beforeProject { project ->
    def buildscriptLockFile = project.path == ':'
        ? project.rootProject.file('buildscript-gradle.lockfile')
        : project.rootProject.file(
            "gradle/dependency-locks/${project.path.substring(1).replace(':', '-')}-buildscript.lockfile"
        )

    project.buildscript.dependencyLocking {
        lockMode = LockMode.STRICT
        lockFile = buildscriptLockFile
    }
    project.buildscript.configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }
}
